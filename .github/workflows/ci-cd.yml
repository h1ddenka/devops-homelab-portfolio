name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint Infrastructure Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage-05-iac/ansible
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r requirements.yml \
            -p ./collections \
            --force

      - name: Lint Ansible playbooks
        uses: ansible/ansible-lint@main
        with:
          args: playbook.yml

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: stage-04-kubernetes/app/Dockerfile

  build-and-validate:
    name: Build and Validate Manifests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t homelab-webapp:ci-test ./stage-04-kubernetes/app

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Validate Kubernetes manifests
        run: |
          echo "Validating Kubernetes manifests..."
          kubectl apply --dry-run=client -f stage-04-kubernetes/manifests/