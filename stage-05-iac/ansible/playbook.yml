---
- name: Configure Homelab Ubuntu Server
  hosts: homelab
  gather_facts: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install base prerequisites
      apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
          - ca-certificates
        state: present

    - name: Configure static IP via Netplan
      copy:
        dest: /etc/netplan/99-static-ip.yaml
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              ens33:
                dhcp4: no
                addresses:
                  - 192.168.227.128/24
                routes:
                  - to: default
                    via: 192.168.227.2
                nameservers:
                  addresses:
                    - 8.8.8.8
                    - 1.1.1.1
        owner: root
        group: root
        mode: '0600'
      notify: Apply netplan

    - name: Configure UFW firewall rules
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - 22
        - 80
        - 443
        - 30080
        - 8080

    - name: Enable UFW with default deny policy
      ufw:
        state: enabled
        policy: deny

    - name: Install Docker Engine
      shell: |
        curl -fsSL https://get.docker.com -o get-docker.sh
        sh get-docker.sh
      args:
        creates: /usr/bin/docker

    - name: Add devops user to docker group
      user:
        name: devops
        groups: docker
        append: yes

    - name: Install K3s
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Configure kubectl for devops user
      shell: |
        mkdir -p /home/devops/.kube
        cp /etc/rancher/k3s/k3s.yaml /home/devops/.kube/config
        chown devops:devops /home/devops/.kube/config
        chmod 600 /home/devops/.kube/config
      args:
        creates: /home/devops/.kube/config

  handlers:
    - name: Apply netplan
      command: netplan apply
