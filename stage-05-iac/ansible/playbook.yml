---
- name: Configure Homelab Ubuntu Server
  hosts: homelab
  gather_facts: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
          - ca-certificates
        state: present

    - name: Configure static IP via Netplan
      ansible.builtin.copy:
        dest: /etc/netplan/99-static-ip.yaml
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              ens33:
                dhcp4: false
                addresses:
                  - 192.168.227.128/24
                routes:
                  - to: default
                    via: 192.168.227.2
                nameservers:
                  addresses:
                    - 8.8.8.8
                    - 1.1.1.1
        owner: root
        group: root
        mode: "0600"
      notify: Apply netplan

    - name: Configure UFW firewall rules
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "80"
        - "443"
        - "30080"
        - "8080"

    - name: Enable UFW with default deny policy
      community.general.ufw:
        state: enabled
        policy: deny

    - name: Download Docker installation script
      ansible.builtin.get_url:
        url: https://get.docker.com
        dest: /tmp/get-docker.sh
        mode: "0755"
      args:
        creates: /tmp/get-docker.sh

    - name: Install Docker Engine
      ansible.builtin.command: /tmp/get-docker.sh
      args:
        creates: /usr/bin/docker
      changed_when: false

    - name: Add devops user to docker group
      ansible.builtin.user:
        name: devops
        groups: docker
        append: true

    - name: Download K3s installation script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/get-k3s.sh
        mode: "0755"
      args:
        creates: /tmp/get-k3s.sh

    - name: Install K3s
      ansible.builtin.command: /tmp/get-k3s.sh
      args:
        creates: /usr/local/bin/k3s
      changed_when: false

    - name: Configure kubectl for devops user
      ansible.builtin.shell: |
        mkdir -p /home/devops/.kube
        cp /etc/rancher/k3s/k3s.yaml /home/devops/.kube/config
        chown devops:devops /home/devops/.kube/config
        chmod 600 /home/devops/.kube/config
      args:
        creates: /home/devops/.kube/config

  handlers:
    - name: Apply netplan
      ansible.builtin.command: netplan apply
      changed_when: false
